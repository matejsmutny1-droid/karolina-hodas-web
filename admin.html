<!DOCTYPE html>
<html lang="sk">
<head>


<title>Admin – Kara Masáže</title>
<style>
  * { box-sizing: border-box; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: #121212; 
    color: #fff; 
    padding: 15px; 
    max-width: 950px; 
    margin: auto; 
  }
  h1 { color: #c5a059; font-size: 1.6rem; text-align: center; margin-bottom: 20px; }
  h2 { color: #c5a059; font-size: 1.2rem; margin-top: 0; }
  .box { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
  
  form { display: flex; flex-direction: column; gap: 10px; }
  label { font-size: 0.9rem; color: #aaa; }
  input, select, button { 
    width: 100%; 
    padding: 12px; 
    border-radius: 6px; 
    border: 1px solid #444; 
    background: #2a2a2a; 
    color: #fff; 
    font-size: 16px; 
  }
  button { 
    background: #c5a059; 
    color: #000; 
    border: none; 
    font-weight: bold; 
    cursor: pointer; 
    transition: 0.2s; 
    margin-top: 5px;
  }
  button:active { transform: scale(0.98); }

  /* MOBILNÁ TABUĽKA -> KARTY */
  .table-wrapper { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid #333; padding: 10px; text-align: left; }
  th { background: #2a2a2a; color: #c5a059; font-size: 0.85rem; }
  
  .status-free { color: #55ff55; font-weight: bold; }
  .status-booked { color: #ff5555; font-weight: bold; }
  .btn-delete { background: #ff4444; color: #fff; padding: 8px 12px; font-size: 13px; border-radius: 4px; width: auto; }

  /* Štýly pre mobily */
  @media (max-width: 768px) {
    body { padding: 10px; }
    .box { padding: 15px; }
    
    table, thead, tbody, th, td, tr { display: block; }
    thead tr { position: absolute; top: -9999px; left: -9999px; }
    
    tr { 
      border: 1px solid #333; 
      border-radius: 6px; 
      margin-bottom: 12px; 
      background: #252525; 
      padding: 10px;
    }
    
    td { 
      border: none;
      position: relative;
      padding-left: 45%; 
      text-align: right;
      font-size: 0.95rem;
      border-bottom: 1px solid #333;
    }
    td:last-child { border-bottom: none; }
    
    td:before { 
      position: absolute;
      left: 10px;
      width: 40%; 
      padding-right: 10px; 
      white-space: nowrap;
      text-align: left;
      font-weight: bold;
      color: #c5a059;
      content: attr(data-label);
    }
    .btn-delete { width: 100%; margin-top: 5px; }
  }
</style>
</head>
<body>

<h1>Správa termínov – Kara Masáže</h1>


<div class="box">
  <h2>Pridať nový voľný termín</h2>
  <form id="addSlotForm">
    <label for="newDate">Dátum:</label>
    <input type="date" id="newDate" required>
    
    <label for="newTime">Čas (začiatok termínu, napr. 13:30):</label>
    <input type="time" id="newTime" required>

    <label for="newDuration">Maximálne dostupné časové okno (dĺžka):</label>
    <select id="newDuration" required>
      <option value="180" selected>Bez obmedzenia / max 180 min (3 hod)</option>
      <option value="30">max 30 minút</option>
      <option value="60">max 60 minút (1 hod)</option>
      <option value="90">max 90 minút (1,5 hod)</option>
      <option value="120">max 120 minút (2 hod)</option>
      <option value="150">max 150 minút (2,5 hod)</option>
    </select>
    
    <button type="submit">Pridať termín do ponuky</button>
  </form>
</div>


<div class="box">
  <h2>Zoznam všetkých termínov</h2>
  <button id="refreshBtn">Obnoviť zoznam</button>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Dátum</th>
          <th>Čas</th>
          <th>Max okno</th>
          <th>Stav</th>
          <th>Meno klienta / Masáž</th>
          <th>Kontakt</th>
          <th>Akcia</th>
        </tr>
      </thead>
      <tbody id="slotsTableBody">
        <tr><td colspan="7">Načítavam dáta...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAUiW5uWKkj_aDq_4KXz2bdBIuxTQbadE",
    authDomain: "kara-masaze.firebaseapp.com",
    projectId: "kara-masaze",
    storageBucket: "kara-masaze.firebasestorage.app",
    messagingSenderId: "786304506671",
    appId: "1:786304506671:web:b24473b8298107da955fda",
    measurementId: "G-QQH0H51RZH"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById("addSlotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const date = document.getElementById("newDate").value;
    const time = document.getElementById("newTime").value;
    const duration = document.getElementById("newDuration").value;

    try {
      await addDoc(collection(db, "terminy"), {
        datum: date,
        cas: time,
        trvanie: parseInt(duration),
        obsadene: false
      });
      alert("Voľný termín bol pridaný!");
      loadSlots();
    } catch (err) {
      alert("Chyba: " + err);
    }
  });

  async function loadSlots() {
    const tbody = document.getElementById("slotsTableBody");
    tbody.innerHTML = "<tr><td colspan='7'>Načítavam...</td></tr>";

    try {
      const q = query(collection(db, "terminy"));
      const querySnapshot = await getDocs(q);
      tbody.innerHTML = "";

      if (querySnapshot.empty) {
        tbody.innerHTML = "<tr><td colspan='7'>Žiadne termíny v databáze.</td></tr>";
        return;
      }

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const tr = document.createElement("tr");

        const clientInfo = data.meno ? `${data.meno}
<small style='color:#c5a059'>${data.masaz || ''}</small>: '-'; const contactInfo = data.telefon ?<a href="tel:${data.telefon}" style="color:#c5a059">${data.telefon}</a><small>${data.email || ''}</small>` : '-';
const maxTime = data.trvanie ? `${data.trvanie} min` : '180 min';    tr.innerHTML = `
      <td data-label="Dátum">${data.datum}</td>
      <td data-label="Čas">${data.cas}</td>
      <td data-label="Max okno">${maxTime}</td>
      <td data-label="Stav" class="\({data.obsadene ? 'status-booked' : 'status-free'}">\){data.obsadene ? 'OBSADENÉ' : 'Voľné'}</td>
      <td data-label="Klient / Masáž">${clientInfo}</td>
      <td data-label="Kontakt">${contactInfo}</td>
      <td data-label="Akcia"><button class="btn-delete" onclick="window.deleteSlot('${docSnap.id}')">Vymazať</button></td>
    `;
    tbody.appendChild(tr);
  });
} catch (err) {
  tbody.innerHTML = `<tr><td colspan='7'>Chyba pri načítaní: ${err}</td></tr>`;
}
}window.deleteSlot = async function(id) {if (confirm("Naozaj chcete vymazať tento termín?")) {await deleteDoc(doc(db, "terminy", id));loadSlots();}};document.getElementById("refreshBtn").addEventListener("click", loadSlots);loadSlots();</script></body></html>
