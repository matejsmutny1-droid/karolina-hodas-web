<!DOCTYPE html>
<html lang="sk">
<head>


<title>Admin – Kara Masáže</title>
<style>
  * { box-sizing: border-box; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: #121212; 
    color: #fff; 
    padding: 15px; 
    max-width: 950px; 
    margin: auto; 
  }
  h1 { color: #c5a059; font-size: 1.6rem; text-align: center; margin-bottom: 20px; }
  h2 { color: #c5a059; font-size: 1.2rem; margin-top: 0; }
  .box { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
  
  form { display: flex; flex-direction: column; gap: 10px; }
  label { font-size: 0.9rem; color: #aaa; }
  input, select, button { 
    width: 100%; 
    padding: 12px; 
    border-radius: 6px; 
    border: 1px solid #444; 
    background: #2a2a2a; 
    color: #fff; 
    font-size: 16px; 
  }
  button { 
    background: #c5a059; 
    color: #000; 
    border: none; 
    font-weight: bold; 
    cursor: pointer; 
    transition: 0.2s; 
    margin-top: 5px;
  }
  button:active { transform: scale(0.98); }

  /* MOBILNÁ TABUĽKA -> KARTY */
  .table-wrapper { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid #333; padding: 10px; text-align: left; }
  th { background: #2a2a2a; color: #c5a059; font-size: 0.85rem; }
  #refreshBtn { width: auto; min-width: 190px; }
  .date-group-row td {
    background: #302a1d;
    color: #e0bd73;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px 14px;
    border-top: 2px solid #c5a059;
  }
  
  .status-free { color: #55ff55; font-weight: bold; }
  .status-partial { color: #e0bd73; font-weight: bold; }
  .status-booked { color: #ff5555; font-weight: bold; }
  .btn-delete { background: #ff4444; color: #fff; padding: 8px 12px; font-size: 13px; border-radius: 4px; width: auto; }

  /* Štýly pre mobily */
  @media (max-width: 768px) {
    body { padding: 10px; }
    .box { padding: 15px; }
    
    table, thead, tbody, th, td, tr { display: block; }
    thead tr { position: absolute; top: -9999px; left: -9999px; }
    
    tr { 
      border: 1px solid #333; 
      border-radius: 6px; 
      margin-bottom: 12px; 
      background: #252525; 
      padding: 10px;
    }
    
    td { 
      border: none;
      position: relative;
      padding-left: 45%; 
      text-align: right;
      font-size: 0.95rem;
      border-bottom: 1px solid #333;
    }
    td:last-child { border-bottom: none; }
    
    td:before { 
      position: absolute;
      left: 10px;
      width: 40%; 
      padding-right: 10px; 
      white-space: nowrap;
      text-align: left;
      font-weight: bold;
      color: #c5a059;
      content: attr(data-label);
    }
    .date-group-row {
      border: 0;
      background: transparent;
      padding: 0;
      margin: 18px 0 8px;
    }
    .date-group-row td {
      display: block;
      border: 1px solid #6e592f;
      border-radius: 6px;
      padding: 11px 12px;
      text-align: left;
      background: #302a1d;
    }
    .date-group-row td:before { content: none; }
    .btn-delete { width: 100%; margin-top: 5px; }
  }
</style>
</head>
<body>

<h1>Správa termínov – Kara Masáže</h1>


<div class="box">
  <h2>Pridať nový voľný termín</h2>
  <form id="addSlotForm">
    <label for="newDate">Dátum:</label>
    <input type="date" id="newDate" required>
    
    <label for="newTime">Čas (začiatok termínu, napr. 13:30):</label>
    <input type="time" id="newTime" required>

    <label for="newDuration">Dostupné časové okno (vrátane masáží a prestávok):</label>
    <select id="newDuration" required>
      <option value="180" selected>180 minút (3 hodiny)</option>
      <option value="45">45 minút (30 min masáž + 15 min prestávka)</option>
      <option value="60">60 minút (1 hodina)</option>
      <option value="90">90 minút (1,5 hodiny)</option>
      <option value="120">120 minút (2 hodiny)</option>
      <option value="150">150 minút (2,5 hodiny)</option>
      <option value="210">210 minút (3,5 hodiny; aj na 180 min masáž + 30 min prestávku)</option>
    </select>
    <small style="color:#aaa;line-height:1.5">Prestávka sa počíta do okna dostupnosti. Napríklad 30 min masáž + 15 min prestávka obsadí 45 minút.</small>
    
    <button type="submit">Pridať termín do ponuky</button>
  </form>
</div>


<div class="box">
  <h2>Zoznam všetkých termínov</h2>
  <button id="refreshBtn">Obnoviť zoznam</button>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Dátum</th>
          <th>Čas</th>
          <th>Dĺžka</th>
          <th>Voľný čas / stav</th>
          <th>Meno klienta / Masáž</th>
          <th>Kontakt</th>
          <th>Akcia</th>
        </tr>
      </thead>
      <tbody id="slotsTableBody">
        <tr><td colspan="7">Načítavam dáta...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAUiW5uWKkj_aDq_4KXz2bdBIuxTQbadE",
    authDomain: "kara-masaze.firebaseapp.com",
    projectId: "kara-masaze",
    storageBucket: "kara-masaze.firebasestorage.app",
    messagingSenderId: "786304506671",
    appId: "1:786304506671:web:b24473b8298107da955fda",
    measurementId: "G-QQH0H51RZH"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById("addSlotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const date = document.getElementById("newDate").value;
    const time = document.getElementById("newTime").value;
    const duration = document.getElementById("newDuration").value;

    try {
      await addDoc(collection(db, "terminy"), {
        datum: date,
        cas: time,
        trvanie: parseInt(duration),
        obsadene: false
      });
      alert("Voľný termín bol pridaný!");
      loadSlots();
    } catch (err) {
      alert("Chyba: " + err);
    }
  });

  function slotDuration(slot) {
    return Number.parseInt(slot.trvanie, 10) || 180;
  }

  function getBookedDuration(booking) {
    return Number.parseInt(booking.trvanieRezervacie, 10) ||
      Number.parseInt((booking.masaz || '').match(/(\d+)\s*min/i)?.[1], 10) || 0;
  }

  function breakMinutes(duration) {
    if (duration === 30) return 15;
    if (duration === 150 || duration === 180) return 30;
    return 20;
  }

  function bookedPause(booking, duration) {
    const savedPause = Number.parseInt(booking.prestavka, 10);
    return Number.isNaN(savedPause) ? breakMinutes(duration) : savedPause;
  }

  function reservationsForSlot(slot) {
    if (Array.isArray(slot.rezervacie)) return slot.rezervacie;
    if (!slot.obsadene) return [];
    const duration = getBookedDuration(slot) || slotDuration(slot);
    return [{
      id: 'legacy', cas: slot.cas, meno: slot.meno || '', telefon: slot.telefon || '',
      email: slot.email || '', masaz: slot.masaz || '', trvanieRezervacie: duration,
      prestavka: bookedPause(slot, duration)
    }];
  }

  function toMinutes(time) {
    const [hours, minutes] = (time || '0:0').split(':').map(Number);
    return hours * 60 + minutes;
  }

  function formatTime(minutes) {
    return `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`;
  }

  function freeIntervals(slot, reservations) {
    const start = toMinutes(slot.cas);
    const end = start + slotDuration(slot);
    const blocked = reservations.map(booking => {
      const duration = getBookedDuration(booking);
      const bookingStart = toMinutes(booking.cas);
      return {
        start: Math.max(start, bookingStart),
        end: Math.min(end, bookingStart + duration + bookedPause(booking, duration))
      };
    }).filter(interval => interval.end > interval.start).sort((a, b) => a.start - b.start);

    const merged = [];
    blocked.forEach(interval => {
      const last = merged[merged.length - 1];
      if (last && interval.start <= last.end) last.end = Math.max(last.end, interval.end);
      else merged.push({ ...interval });
    });

    const free = [];
    let cursor = start;
    merged.forEach(interval => {
      if (interval.start > cursor) free.push({ start: cursor, end: interval.start });
      cursor = Math.max(cursor, interval.end);
    });
    if (cursor < end) free.push({ start: cursor, end });
    return free.filter(interval => interval.end > interval.start);
  }

  function renderWindowRow(docId, data) {
    const reservations = reservationsForSlot(data);
    const intervals = freeIntervals(data, reservations);
    const remaining = intervals.length
      ? intervals.map(interval => `${formatTime(interval.start)}–${formatTime(interval.end)} (${interval.end - interval.start} min)`).join('<br>')
      : 'Žiadny voľný čas';
    const statusClass = intervals.length ? (reservations.length ? 'status-partial' : 'status-free') : 'status-booked';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td data-label="Dátum">${escapeHtml(data.datum || '')}</td>
      <td data-label="Začiatok okna">${escapeHtml(data.cas || '')}</td>
      <td data-label="Dostupné okno">${slotDuration(data)} min</td>
      <td data-label="Voľný čas" class="${statusClass}">${remaining}</td>
      <td data-label="Klient / Masáž">Dostupnosť</td>
      <td data-label="Kontakt">–</td>
      <td data-label="Akcia"><button class="btn-delete btn-delete-window" data-id="${escapeHtml(docId)}">Vymazať okno</button></td>
    `;
    tr.querySelector('.btn-delete-window').addEventListener('click', () => window.deleteSlot(docId));
    return tr;
  }

  function renderReservationRow(docId, data, booking) {
    const duration = getBookedDuration(booking);
    const tr = document.createElement('tr');
    tr.className = 'reservation-row';
    tr.innerHTML = `
      <td data-label="Dátum">${escapeHtml(data.datum || '')}</td>
      <td data-label="Čas rezervácie">${escapeHtml(booking.cas || '')}</td>
      <td data-label="Masáž + prestávka">${duration} + ${bookedPause(booking, duration)} min</td>
      <td data-label="Stav" class="status-booked">OBSADENÉ</td>
      <td data-label="Klient / Masáž">${escapeHtml(booking.meno || 'Klient')}<br><small style="color:#c5a059">${escapeHtml(booking.masaz || '')}</small></td>
      <td data-label="Kontakt">${booking.telefon ? `<a href="tel:${escapeHtml(booking.telefon)}" style="color:#c5a059">${escapeHtml(booking.telefon)}</a>` : '–'}<br><small>${escapeHtml(booking.email || '')}</small></td>
      <td data-label="Akcia"><button class="btn-delete btn-cancel-reservation" data-slot-id="${escapeHtml(docId)}" data-reservation-id="${escapeHtml(booking.id || 'legacy')}">Zrušiť rezerváciu</button></td>
    `;
    tr.querySelector('.btn-cancel-reservation').addEventListener('click', () => window.cancelReservation(docId, booking.id || 'legacy'));
    return tr;
  }

  async function loadSlots() {
    const tbody = document.getElementById("slotsTableBody");
    tbody.innerHTML = "<tr><td colspan='7'>Načítavam...</td></tr>";

    try {
      const q = query(collection(db, "terminy"));
      const querySnapshot = await getDocs(q);
      tbody.innerHTML = "";

      if (querySnapshot.empty) {
        tbody.innerHTML = "<tr><td colspan='7'>Žiadne termíny v databáze.</td></tr>";
        return;
      }

      const sortedDocs = querySnapshot.docs.slice().sort((a, b) => {
        const first = a.data();
        const second = b.data();
        return String(first.datum || '').localeCompare(String(second.datum || '')) ||
          String(first.cas || '').localeCompare(String(second.cas || ''));
      });

      if (sortedDocs.length === 0) {
        tbody.innerHTML = "<tr><td colspan='7'>Žiadne termíny v databáze.</td></tr>";
        return;
      }

      let previousDate = null;
      sortedDocs.forEach((docSnap) => {
        const data = docSnap.data();
        if (data.datum !== previousDate) {
          previousDate = data.datum;
          const dateHeading = document.createElement('tr');
          dateHeading.className = 'date-group-row';
          const headingCell = document.createElement('td');
          headingCell.colSpan = 7;
          headingCell.textContent = formatDateHeading(data.datum);
          dateHeading.appendChild(headingCell);
          tbody.appendChild(dateHeading);
        }
        tbody.appendChild(renderWindowRow(docSnap.id, data));
        reservationsForSlot(data).forEach(booking => tbody.appendChild(renderReservationRow(docSnap.id, data, booking)));
      });
} catch (err) {
  tbody.innerHTML = `<tr><td colspan='7'>Chyba pri načítaní: ${err}</td></tr>`;
}
}

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
  }

  function formatDateHeading(value) {
    if (!value) return 'Dátum neuvedený';
    const date = new Date(`${value}T00:00:00`);
    if (Number.isNaN(date.getTime())) return value;
    return new Intl.DateTimeFormat('sk-SK', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    }).format(date);
  }

  window.deleteSlot = async function(id) {
    if (confirm("Naozaj chcete vymazať celé časové okno vrátane rezervácií?")) {
      await deleteDoc(doc(db, "terminy", id));
      loadSlots();
    }
  };

  window.cancelReservation = async function(slotId, reservationId) {
    if (!confirm("Naozaj chcete zrušiť túto rezerváciu a uvoľniť jej čas?")) return;
    const slotRef = doc(db, 'terminy', slotId);
    await runTransaction(db, async transaction => {
      const slotSnapshot = await transaction.get(slotRef);
      if (!slotSnapshot.exists()) return;
      const reservations = reservationsForSlot(slotSnapshot.data()).filter(booking => booking.id !== reservationId);
      transaction.update(slotRef, { rezervacie: reservations, obsadene: reservations.length > 0 });
    });
    loadSlots();
  };
  document.getElementById("refreshBtn").addEventListener("click", loadSlots);
  loadSlots();
</script>
</body>
</html>
